name: Build & Release

# v로 시작하는 태그(v1.0.0 등)를 push하면 실행돼요
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # Releases에 파일 올리려면 필요

jobs:
  build:
    runs-on: windows-latest   # Windows에서 exe 빌드
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: 빌드 + GitHub Releases에 배포
        run: npm run dist
        env:
          # GitHub이 자동으로 넣어주는 토큰. 따로 만들 필요 없어요.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
