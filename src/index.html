<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모아 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --accent:#7c5cf0; --accent-2:#9b7bf0; --accent-3:#ff8fc7; --accent-soft:#efe9ff;
    --shadow:0 6px 24px rgba(70,50,120,.10); --shadow-sm:0 2px 8px rgba(70,50,120,.06);
  }
  [data-theme="light"]{--bg:#f4f2f8;--surface:#fff;--surface-2:#faf9fd;--sidebar:#efeaf7;
    --ink:#2b2735;--ink-soft:#6f6885;--ink-faint:#a29cb5;--line:#ece8f3;--line-2:#e3ddef;--frame:#c8c2da;
    --note:#fff9e6;--note-line:#f0e6c0;}
  [data-theme="dark"]{--bg:#1a1726;--surface:#231f31;--surface-2:#1f1b2c;--sidebar:#201c2e;
    --ink:#ece9f5;--ink-soft:#a49dbb;--ink-faint:#6b6483;--line:#2e2940;--line-2:#39334d;--frame:#0f0d17;
    --accent-soft:#2c2545;--note:#2a2618;--note-line:#42391f;
    --shadow:0 6px 24px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.25);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--frame);font-family:'Gowun Dodum',sans-serif;color:var(--ink);
    display:flex;justify-content:center;align-items:center;padding:22px;transition:background .3s;}
  .win{width:1280px;height:760px;background:var(--bg);border-radius:14px;
    box-shadow:0 30px 80px rgba(20,10,40,.5);overflow:hidden;display:flex;flex-direction:column;transition:background .3s;}
  /* Electron 앱 모드: 여백 없이 창 전체 채움 */
  body.app-mode{padding:0 !important;background:transparent !important;}
  body.app-mode .win{width:100vw;height:100vh;border-radius:0;box-shadow:none;}
  .titlebar{height:38px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:8px;flex:0 0 auto;-webkit-app-region:drag;}
  .titlebar .traffic,.titlebar .right,.titlebar input,.titlebar button{-webkit-app-region:no-drag;}
  .win-ctrl{display:flex;gap:4px;margin-left:2px;}
  .wc-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .wc-btn:hover{background:var(--bg);}
  .wc-close:hover{background:#ff5b6e;color:#fff;}
  .traffic{display:flex;gap:8px;}.traffic span{width:12px;height:12px;border-radius:50%;}
  .traffic .r{background:#ff5f57;}.traffic .y{background:#febc2e;}.traffic .g{background:#28c840;}
  .titlebar .app-name{font-family:'Jua';font-size:13px;color:var(--ink-soft);margin-left:6px;}
  .titlebar .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .win-search{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--ink);width:180px;font-family:'Gowun Dodum';}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);color:var(--ink-soft);cursor:pointer;font-size:13px;}
  .icon-btn:hover{background:var(--accent-soft);color:var(--accent);}
  .body{flex:1;display:flex;min-height:0;}

  /* 사이드바 */
  .sidebar{width:236px;background:var(--sidebar);border-right:1px solid var(--line-2);flex:0 0 auto;padding:18px 14px;display:flex;flex-direction:column;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;padding:0 4px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-3));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;box-shadow:var(--shadow-sm);}
  .brand .nm{font-family:'Jua';font-size:15px;}
  .brand .nm small{display:block;font-family:'Gowun Dodum';font-size:10px;color:var(--ink-faint);font-weight:normal;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;font-size:13.5px;color:var(--ink-soft);cursor:pointer;margin-bottom:2px;transition:.12s;}
  .nav-item i{font-size:14px;width:18px;text-align:center;}
  .nav-item:hover{background:var(--accent-soft);}
  .nav-item.on{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .side-label{font-size:10.5px;color:var(--ink-faint);letter-spacing:.5px;margin:18px 6px 8px;font-family:'Jua';display:flex;align-items:center;justify-content:space-between;}
  .side-label .edit{cursor:pointer;color:var(--ink-faint);font-size:10px;}
  .side-label .edit:hover{color:var(--accent);}
  .filter-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .filter-item:hover{background:var(--accent-soft);}
  .filter-item.off{opacity:.4;}
  .filter-item .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .filter-item .cnt{margin-left:auto;font-size:11px;color:var(--ink-faint);}
  .type-list{display:flex;flex-direction:column;gap:1px;}

  /* 미니메모 */
  .mini-memo{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;flex:0 0 auto;}
  .mini-memo .mm-head{font-size:10.5px;color:var(--ink-faint);font-family:'Jua';margin:0 4px 7px;display:flex;align-items:center;justify-content:space-between;}
  .mini-memo .mm-head .exp{cursor:pointer;color:var(--ink-faint);}
  .mini-memo .mm-head .exp:hover{color:var(--accent);}
  .mini-memo textarea{width:100%;height:88px;background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:10px;font-family:'Gowun Dodum';font-size:12px;color:var(--ink);resize:none;line-height:1.7;}
  .mini-memo textarea:focus{outline:2px solid var(--accent-soft);}

  /* 메인 */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px 20px;}
  .page{display:none;flex-direction:column;flex:1;min-height:0;}
  .page.on{display:flex;}
  .main-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .main-head .mon{font-family:'Jua';font-size:26px;letter-spacing:-.5px;}
  .main-head .mon small{font-size:15px;color:var(--ink-faint);margin-left:6px;}
  .page-title{font-family:'Jua';font-size:24px;}
  .nav-arrows{display:flex;gap:6px;}
  .nav-arrows button,.today-btn{border:none;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:9px;cursor:pointer;color:var(--ink-soft);font-family:'Gowun Dodum';}
  .nav-arrows button{width:32px;height:32px;font-size:13px;}
  .today-btn{padding:0 15px;height:32px;font-size:12.5px;}
  .view-toggle{margin-left:auto;background:var(--surface);border-radius:10px;padding:3px;display:flex;box-shadow:var(--shadow-sm);}
  .view-toggle button{border:none;background:none;padding:6px 16px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-family:'Gowun Dodum';transition:.15s;}
  .view-toggle button.on{background:var(--accent);color:#fff;}
  .add-main{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 15px;height:32px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm);}
  .cal-wrap{flex:1;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-sm);padding:14px;display:flex;flex-direction:column;min-height:0;}

  .month-view{display:flex;flex-direction:column;flex:1;min-height:0;}
  .month-view.hide{display:none;}
  .wk-head{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;}
  .wk-head span{text-align:center;font-size:11.5px;color:var(--ink-faint);font-family:'Jua';}
  .wk-head .sun{color:#ff8a8a;}.wk-head .sat{color:#8aa8ff;}
  .mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:5px;min-height:0;}
  .mcell{background:var(--surface-2);border-radius:10px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1.5px solid transparent;overflow:hidden;transition:.12s;}
  .mcell:hover{border-color:var(--line-2);}
  .mcell.other{opacity:.32;}
  .mcell.today{background:var(--accent-soft);border-color:var(--accent);}
  .mcell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .mcell .dnum{font-size:12px;font-family:'Jua';color:var(--ink-soft);}
  .mcell.today .dnum{color:var(--accent);}
  .mcell .ev{font-size:10.5px;padding:2px 6px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;cursor:grab;}
  .mcell .ev:active{cursor:grabbing;}
  .mcell.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);}
  .mcell .more{font-size:9.5px;color:var(--ink-faint);padding-left:4px;}
  .day-pop{position:fixed;z-index:300;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 32px rgba(40,20,80,.22);padding:12px 14px;min-width:180px;max-width:240px;pointer-events:none;animation:popfade .12s ease;}
  @keyframes popfade{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
  .day-pop .dp-date{font-family:'Jua';font-size:12.5px;color:var(--ink);margin-bottom:8px;}
  .day-pop .dp-row{display:flex;align-items:center;gap:8px;padding:4px 0;}
  .day-pop .dp-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .day-pop .dp-t{font-size:12px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-pop .dp-time{font-size:10.5px;color:var(--ink-faint);flex:0 0 auto;}

  .week-view{display:none;flex:1;min-height:0;overflow-y:auto;}
  .week-view.show{display:block;}
  .wday-block{display:flex;gap:14px;padding:10px 6px;border-bottom:1px solid var(--line);}
  .wday-block:last-child{border-bottom:none;}
  .wday-block.today .wd-date .wd-dn{background:var(--accent);color:#fff;}
  .wd-date{width:56px;flex:0 0 auto;text-align:center;padding-top:2px;}
  .wd-date .wd-dow{font-size:11px;color:var(--ink-faint);}
  .wd-date .wd-dn{font-family:'Jua';font-size:20px;width:34px;height:34px;line-height:34px;border-radius:10px;margin:3px auto 0;}
  .wd-date .wd-dow.sun{color:#ff8a8a;}.wd-date .wd-dow.sat{color:#8aa8ff;}
  .wd-events{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:2px;min-width:0;}
  .wd-events .empty{font-size:11.5px;color:var(--ink-faint);padding:8px 2px;}
  .wcard{background:var(--surface-2);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;}
  .wcard .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .wcard .time{font-size:11px;color:var(--ink-faint);width:48px;flex:0 0 auto;}
  .wcard .ttl{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wcard .chip{font-size:9.5px;padding:2px 8px;border-radius:20px;color:#fff;flex:0 0 auto;}

  /* 우측 */
  .rightpane{width:340px;flex:0 0 auto;border-left:1px solid var(--line-2);background:var(--surface-2);display:flex;flex-direction:column;overflow-y:auto;}
  .rp-section{padding:14px 16px;}
  .rp-section+.rp-section{border-top:1px solid var(--line);}
  .side-dday{margin-top:16px;}
  .dday-widget{background:linear-gradient(135deg,var(--accent),var(--accent-2) 55%,var(--accent-3) 130%);border-radius:14px;padding:12px 13px;color:#fff;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .dday-widget::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;background:rgba(255,255,255,.14);border-radius:50%;}
  .dday-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;margin-bottom:6px;}
  .dday-widget .lbl{font-size:9.5px;background:rgba(255,255,255,.24);padding:2px 8px;border-radius:20px;display:inline-flex;gap:4px;align-items:center;}
  .dday-big{font-family:'Jua';font-size:22px;line-height:1;}
  .dday-widget .evn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1;}
  .dday-widget .mt{font-size:10px;opacity:.9;margin-top:3px;display:flex;align-items:center;gap:4px;position:relative;z-index:1;}
  .upcoming-title{font-family:'Jua';font-size:11px;color:var(--ink-faint);margin:12px 2px 7px;}
  .dday-empty{background:var(--surface);border-radius:14px;padding:18px 14px;text-align:center;color:var(--ink-faint);font-size:11.5px;box-shadow:var(--shadow-sm);margin-top:16px;}
  .dday-mini-list{display:flex;flex-direction:column;gap:5px;}
  .dday-mini{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:9px;padding:7px 9px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .dday-mini .dm-bar{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .dday-mini .dm-body{flex:1;min-width:0;padding-left:2px;}
  .dday-mini .dm-t{font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dday-mini .dm-s{font-size:9.5px;color:var(--ink-faint);margin-top:1px;}
  .dday-mini .dm-dd{font-family:'Jua';font-size:12px;flex:0 0 auto;}
  .rp-title{font-family:'Jua';font-size:13px;color:var(--ink-soft);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .rp-title .cnt{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:10px;}
  .todo-row{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;}
  .todo-add-mini{display:flex;gap:6px;margin-bottom:10px;}
  .todo-add-mini input{flex:1;padding:8px 11px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);font-size:12px;color:var(--ink);font-family:'Gowun Dodum';}
  .todo-add-mini input:focus{outline:2px solid var(--accent-soft);}
  .todo-add-mini button{width:32px;border-radius:9px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;flex:0 0 auto;}
  .cbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--ink-faint);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:.15s;}
  .todo-row.done .cbox{background:var(--accent);border-color:var(--accent);}
  .todo-row.done .tx{text-decoration:line-through;color:var(--ink-faint);}
  .tx{font-size:12.5px;flex:1;}
  .todo-del{opacity:0;color:var(--ink-faint);cursor:pointer;font-size:11px;transition:.12s;}
  .todo-row:hover .todo-del{opacity:.7;}
  .rtag{font-size:9.5px;color:#fff;padding:1px 7px;border-radius:10px;}
  .carry-badge{font-size:9.5px;color:#ff8838;background:rgba(255,136,56,.14);padding:1px 7px;border-radius:10px;flex:0 0 auto;white-space:nowrap;}
  .todo-page-row .carry-badge{font-size:11px;padding:2px 9px;}
  .sel-date{font-family:'Jua';font-size:14px;margin-bottom:4px;}
  .sel-sub{font-size:11px;color:var(--ink-faint);margin-bottom:12px;display:flex;align-items:center;gap:5px;}
  .detail-evt{background:var(--surface);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow-sm);margin-bottom:9px;position:relative;overflow:hidden;}
  .detail-evt .bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .detail-evt .dhead{display:flex;align-items:center;justify-content:space-between;}
  .detail-evt .h{font-size:10.5px;color:var(--ink-faint);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
  .detail-evt .tt{font-size:13px;padding-left:2px;}
  .detail-evt .foot{display:flex;gap:5px;margin-top:7px;padding-left:2px;flex-wrap:wrap;align-items:center;}
  .detail-evt .del{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;opacity:.6;}
  .detail-evt .del:hover{opacity:1;color:#ff5b6e;}
  .evt-actions{display:flex;gap:2px;}
  .evt-actions .ea{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:11px;opacity:.55;padding:3px 5px;border-radius:6px;}
  .evt-actions .ea:hover{opacity:1;background:var(--bg);color:var(--accent);}
  .evt-actions .ea.del:hover{color:#ff5b6e;}
  .dl-badge{background:#ff5b6e;color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;font-family:'Jua';}
  .chip{font-size:9.5px;padding:2px 8px;border-radius:20px;color:#fff;}
  .bell{font-size:10.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:3px;}
  .add-evt-btn{width:100%;border:1.5px dashed var(--line-2);background:none;border-radius:12px;padding:10px;color:var(--ink-faint);font-size:12px;cursor:pointer;font-family:'Gowun Dodum';margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .add-evt-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* 할일 페이지 */
  .todo-add{display:flex;gap:8px;margin-bottom:14px;}
  .todo-add input{flex:1;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--surface-2);font-size:13.5px;color:var(--ink);font-family:'Gowun Dodum';}
  .todo-add input:focus{outline:2px solid var(--accent-soft);}
  .todo-add button{width:44px;border-radius:11px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:16px;flex:0 0 auto;}
  .todo-page-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:12px;margin-bottom:7px;}
  .todo-page-row .cbox{width:22px;height:22px;border-radius:7px;font-size:12px;}
  .todo-page-row.done{opacity:.5;}
  .todo-page-row.done .tx{text-decoration:line-through;color:var(--ink-faint);}
  .todo-page-row .tx{font-size:14px;}
  .todo-page-row .del{background:none;border:none;color:var(--ink-faint);cursor:pointer;opacity:.6;}
  .todo-page-row .del:hover{opacity:1;color:#ff5b6e;}
  .todo-empty{text-align:center;color:var(--ink-faint);font-size:13px;padding:40px 0;line-height:1.8;}
  .carry-note{font-size:11.5px;color:var(--ink-faint);background:var(--surface-2);border-radius:10px;padding:9px 13px;margin-bottom:12px;display:flex;align-items:center;gap:7px;line-height:1.5;}

  /* 메모 */
  .memo-full{flex:1;display:flex;gap:16px;min-height:0;}
  .memo-list{width:240px;flex:0 0 auto;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
  .memo-list-item{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm);cursor:pointer;border:1.5px solid transparent;position:relative;}
  .memo-list-item.on{border-color:var(--accent);}
  .memo-list-item .mli-t{font-size:13px;font-family:'Jua';margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px;}
  .memo-list-item .mli-p{font-size:11px;color:var(--ink-faint);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .memo-list-item .mli-d{font-size:10px;color:var(--ink-faint);margin-top:6px;}
  .memo-list-item .mli-del{position:absolute;top:10px;right:10px;color:var(--ink-faint);cursor:pointer;font-size:11px;opacity:0;}
  .memo-list-item:hover .mli-del{opacity:.6;}
  .memo-list-item .mli-del:hover{opacity:1;color:#ff5b6e;}
  .memo-new{border:1.5px dashed var(--line-2);background:none;border-radius:12px;padding:11px;color:var(--ink-faint);cursor:pointer;font-family:'Gowun Dodum';font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;flex:0 0 auto;}
  .memo-new:hover{border-color:var(--accent);color:var(--accent);}
  .memo-editor{flex:1;background:var(--note);border:1px solid var(--note-line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);}
  .memo-editor input{border:none;background:none;font-family:'Jua';font-size:18px;color:var(--ink);margin-bottom:10px;}
  .memo-editor input:focus{outline:none;}

<script>
/* ============ 상태 ============ */
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate()); // 오늘 자정 기준
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
const TK = ymd(TODAY);

let types = [
  {id:'deadline', name:'예약마감', color:'#ff5b6e'},
  {id:'pay', name:'입금일', color:'#ff9838'},
  {id:'release', name:'발매·배송', color:'#5b8def'},
  {id:'event', name:'이벤트', color:'#9b7bf0'},
  {id:'bday', name:'생일', color:'#ff8fc7'},
  {id:'work', name:'창작마감', color:'#3fbfa3'},
];
function findType(id){return types.find(t=>t.id===id)||types[0];}

// 일정: {date:'YYYY-MM-DD', items:[{id,title,time,alarm,typeId}]}
let events = {
  '2026-07-13':[{id:1,title:'굿즈 배송 마감',time:'18:00',alarm:true,typeId:'release'}],
  '2026-07-16':[{id:2,title:'에렌빌 아크릴 예약마감',time:'23:59',alarm:true,typeId:'deadline'},{id:3,title:'한정판 앨범 발매',time:null,alarm:false,typeId:'release'}],
  '2026-07-18':[{id:4,title:'온리전 부스비 입금',time:'18:00',alarm:true,typeId:'pay'}],
  '2026-07-21':[{id:5,title:'커미션 도안 납품',time:null,alarm:false,typeId:'work'}],
  '2026-07-24':[{id:6,title:'온리전',time:'10:00',alarm:false,typeId:'event'}],
  '2026-07-25':[{id:7,title:'데이 생일',time:null,alarm:false,typeId:'bday'}],
  '2026-07-30':[{id:8,title:'굿즈 배송',time:null,alarm:false,typeId:'release'}],
};
// carry: 며칠째 밀렸는지 (0=오늘 새로 만든 것). 실제 앱에선 자정마다 미완료 항목 carry+1
let todos = [
  {id:1,text:'낙서 1장 그리기',done:true,carry:0},
  {id:2,text:'명일 트윗 올리기',done:true,carry:0},
  {id:3,text:'아크릴 예약폼 확인',done:false,carry:2},
  {id:4,text:'신간 표지 러프',done:false,carry:0},
  {id:5,text:'우체국 가서 굿즈 발송',done:false,carry:5},
];
let memos = [
  {id:1,title:'예약 정보 모음',body:'아크릴 예약 도안 #A-1123\n입금 계좌: 카카오뱅크 3333-01-...\n\n- 예약마감 7/16 23:59\n- 굿즈 배송 예정 7/30',date:'7/13'},
  {id:2,title:'온리전 준비 체크',body:'부스 배치, 잔돈 준비, 명함, 견본\n포스터 A2 2장 챙기기',date:'7/11'},
  {id:3,title:'데이 생일 아이디어',body:'에렌빌이랑 케이크, 밤바다 배경 낙서',date:'7/9'},
];

let uid = 100;
let soundOn = true;
let viewY = TODAY.getFullYear(), viewM = TODAY.getMonth();
let selectedDate = TK;
let calView = 'month';
let openMemoId = 1;
let activeTypeFilter = null; // null=전체
const WD = ['일','월','화','수','목','금','토'];

/* ============ 렌더: 사이드바 종류 필터 ============ */
function renderTypeFilters(){
  const box = document.getElementById('typeFilters');
  const counts = {};
  Object.values(events).flat().forEach(e=>counts[e.typeId]=(counts[e.typeId]||0)+1);
  box.innerHTML = types.map(t=>`
    <div class="filter-item ${activeTypeFilter&&activeTypeFilter!==t.id?'off':''}" data-tid="${t.id}">
      <span class="dot" style="background:${t.color}"></span>${t.name}
      <span class="cnt">${counts[t.id]||0}</span>
    </div>`).join('');
  box.querySelectorAll('.filter-item').forEach(el=>el.onclick=()=>{
    activeTypeFilter = activeTypeFilter===el.dataset.tid ? null : el.dataset.tid;
    renderAll();
  });
}

/* ============ 렌더: 월간 달력 ============ */
let draggingEvId=null, draggingFrom=null;
function moveEventTo(toKey){
  if(!draggingEvId||!draggingFrom||toKey===draggingFrom) return;
  const fromList=events[draggingFrom]||[];
  const idx=fromList.findIndex(e=>e.id===draggingEvId);
  if(idx<0) return;
  const [ev]=fromList.splice(idx,1);
  if(!fromList.length) delete events[draggingFrom];
  if(!events[toKey]) events[toKey]=[];
  events[toKey].push(ev);
  selectedDate=toKey;
  draggingEvId=null; draggingFrom=null;
  renderAll();
}
function renderMonth(){
  const mgrid = document.getElementById('mgrid');
  hideDayPop();
  document.getElementById('monLabel').innerHTML = calView==='month'
    ? `${viewM+1}월<small>${viewY}</small>`
    : `${viewM+1}월<small>${viewY}</small>`;
  const firstDow = new Date(viewY,viewM,1).getDay();
  const daysInMonth = new Date(viewY,viewM+1,0).getDate();
  const prevLast = new Date(viewY,viewM,0).getDate();
  let cells=[];
  for(let i=firstDow-1;i>=0;i--) cells.push({d:prevLast-i,other:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({d,other:false});
  while(cells.length<42) cells.push({d:cells.length-firstDow-daysInMonth+1,other:true});

  mgrid.innerHTML = cells.map(c=>{
    if(c.other) return `<div class="mcell other"><span class="dnum">${c.d}</span></div>`;
    const key = ymd(new Date(viewY,viewM,c.d));
    let list = (events[key]||[]);
    if(activeTypeFilter) list = list.filter(e=>e.typeId===activeTypeFilter);
    let evHtml = list.slice(0,2).map(e=>{
      const t=findType(e.typeId);
      return `<span class="ev" draggable="true" data-evid="${e.id}" data-from="${key}" style="background:${t.color}">${e.isDeadline?'⚠ ':''}${e.title}</span>`;
    }).join('');
    if(list.length>2) evHtml+=`<span class="more">+${list.length-2}</span>`;
    const cls = 'mcell'+(key===TK?' today':'')+(key===selectedDate?' sel':'');
    return `<div class="${cls}" data-key="${key}"><span class="dnum">${c.d}</span>${evHtml}</div>`;
  }).join('');

  mgrid.querySelectorAll('.mcell:not(.other)').forEach(el=>{
    el.onclick=(e)=>{ if(el._dragging)return; selectedDate = el.dataset.key; renderMonth(); renderSelectedDay(); };
    const key=el.dataset.key;
    let list=(events[key]||[]);
    if(activeTypeFilter) list=list.filter(e=>e.typeId===activeTypeFilter);
    if(list.length>0){
      el.onmouseenter=()=>{ if(!draggingEvId) showDayPop(el,key,list); };
      el.onmouseleave=hideDayPop;
    }
    // 드롭 타겟
    el.ondragover=(e)=>{ e.preventDefault(); el.classList.add('drop-hover'); };
    el.ondragleave=()=>el.classList.remove('drop-hover');
    el.ondrop=(e)=>{
      e.preventDefault(); el.classList.remove('drop-hover');
      moveEventTo(el.dataset.key);
    };
  });

  // 일정 드래그 시작/끝
  mgrid.querySelectorAll('.ev[draggable]').forEach(sp=>{
    sp.ondragstart=(e)=>{
      draggingEvId=+sp.dataset.evid; draggingFrom=sp.dataset.from;
      hideDayPop();
      e.dataTransfer.effectAllowed='move';
    };
    sp.ondragend=()=>{ draggingEvId=null; draggingFrom=null; };
  });
}

/* 월간 hover 팝오버 */
let dayPopEl=null;
function hideDayPop(){ if(dayPopEl){dayPopEl.remove();dayPopEl=null;} }
function showDayPop(anchor,key,list){
  hideDayPop();
  const d=new Date(key);
  const dpop=document.createElement('div');
  dpop.className='day-pop';
  dpop.innerHTML=`<div class="dp-date">${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</div>`+
    list.map(e=>{const t=findType(e.typeId);
      return `<div class="dp-row"><span class="dp-dot" style="background:${t.color}"></span>
        <span class="dp-t">${e.title}</span>
        <span class="dp-time">${e.alarm?'<i class="fa-solid fa-bell" style="font-size:8px;margin-right:3px;"></i>':''}${e.time||'종일'}</span></div>`;
    }).join('');
  document.body.appendChild(dpop);
  const r=anchor.getBoundingClientRect();
  const pr=dpop.getBoundingClientRect();
  let left=r.left+r.width/2-pr.width/2;
  let top=r.bottom+6;
  left=Math.max(8,Math.min(left,window.innerWidth-pr.width-8));
  if(top+pr.height>window.innerHeight-8) top=r.top-pr.height-6;
  dpop.style.left=left+'px'; dpop.style.top=top+'px';
  dayPopEl=dpop;
}

/* ============ 렌더: 주간 ============ */
function renderWeek(){
  const wv = document.getElementById('weekView');
  // 선택일(또는 오늘) 기준 그 주 일~토
  const base = new Date(selectedDate);
  const sunday = new Date(base); sunday.setDate(base.getDate()-base.getDay());
  let html='';
  for(let i=0;i<7;i++){
    const d = new Date(sunday); d.setDate(sunday.getDate()+i);
    const key = ymd(d);
    let list = (events[key]||[]).slice();
    if(activeTypeFilter) list = list.filter(e=>e.typeId===activeTypeFilter);
    list.sort((a,b)=>((a.time||'00:00')>(b.time||'00:00')?1:-1));
    const dowCls = i===0?'sun':i===6?'sat':'';
    const evHtml = list.length? list.map(e=>{
      const t=findType(e.typeId);
      return `<div class="wcard"><div class="bar" style="background:${t.color}"></div><div class="time">${e.time||'종일'}</div><div class="ttl">${e.title}</div><span class="chip" style="background:${t.color}">${t.name}</span></div>`;
    }).join('') : `<div class="empty">일정 없음</div>`;
    html+=`<div class="wday-block ${key===TK?'today':''}"><div class="wd-date"><div class="wd-dow ${dowCls}">${WD[i]}</div><div class="wd-dn">${d.getDate()}</div></div><div class="wd-events">${evHtml}</div></div>`;
  }
  wv.innerHTML=html;
}

/* ============ 렌더: 선택일 상세(우측) ============ */
function renderSelectedDay(){
  const d = new Date(selectedDate);
  document.getElementById('selDate').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;

        </div></div>

        <div class="foot"><span class="chip" style="background:${t.color}">${t.name}</span>${e.isDeadline?'<span class="dl-badge">마감</span>':''}${e.alarm?`<span class="bell"><i class="fa-solid fa-bell" style="color:${t.color}"></i></span>`:''}</div></div>`;
    }).join('');
    box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
      events[selectedDate]=events[selectedDate].filter(x=>x.id!=b.dataset.id);
      if(!events[selectedDate].length) delete events[selectedDate];
      renderAll();
    });
    box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
      const ev=(events[selectedDate]||[]).find(x=>x.id==b.dataset.edit);
      if(ev) openModal(selectedDate, ev);
    });
    box.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{
      const ev=(events[selectedDate]||[]).find(x=>x.id==b.dataset.dup);
      if(ev){
        const copy={...ev,id:++uid};
        if(!events[selectedDate]) events[selectedDate]=[];
        events[selectedDate].push(copy);
        renderAll();
        // 복제 직후 수정 창을 열어 날짜(다른 달 포함)를 바로 바꿀 수 있게
        openModal(selectedDate, copy);
      }
    });
  }
}

/* ============ 렌더: D-day 위젯 ============ */
function renderDday(){
  const box = document.getElementById('ddayWidget');
  let all=[];
  Object.entries(events).forEach(([key,list])=>{
    const d=new Date(key);
    const diff=Math.round((d-TODAY)/86400000);
    if(diff<0) return;
    list.forEach(e=>all.push({diff,e,key,d,priority:e.typeId==='deadline'?0:1}));
  });
  all.sort((a,b)=> a.diff-b.diff || a.priority-b.priority);

  if(all.length===0){box.innerHTML=`<div class="dday-empty">다가오는 일정이 없어요</div>`;return;}

  const best=all[0];
  const bd=best.d;
  // 사이드바 폭에 맞춘 컴팩트 D-day
  let html=`<div class="dday-widget">
    <div class="dday-top"><span class="lbl"><i class="fa-solid fa-fire"></i> 가장 가까운</span>
    <span class="dday-big">${best.diff===0?'D-DAY':'D-'+best.diff}</span></div>
    <div class="evn">${best.e.title}</div>
    <div class="mt"><i class="fa-solid fa-clock"></i> ${bd.getMonth()+1}/${bd.getDate()}(${WD[bd.getDay()]}) ${best.e.time||'종일'}</div>
  </div>`;

  // 다가오는 일정 4개
  const rest=all.slice(1,5);
  if(rest.length){
    html+=`<div class="upcoming-title">다가오는 일정</div><div class="dday-mini-list">`+rest.map(({diff,e,d})=>{
      const t=findType(e.typeId);
      return `<div class="dday-mini"><div class="dm-bar" style="background:${t.color}"></div>
        <div class="dm-body"><div class="dm-t">${e.title}</div>
        <div class="dm-s">${d.getMonth()+1}/${d.getDate()} · ${e.time||'종일'}</div></div>
        <div class="dm-dd" style="color:${t.color}">${diff===0?'DAY':'-'+diff}</div></div>`;
    }).join('')+`</div>`;
  }
  box.innerHTML=html;
}

/* ============ 렌더: 할일(우측 + 페이지) ============ */
function carryBadge(t){
  return (!t.done && t.carry>0) ? `<span class="carry-badge">${t.carry}일째</span>` : '';
}
function renderTodos(){
  // 완료 안 된 것 먼저, 그 안에서 오래 밀린 것(carry 큰) 위로
  const sorted=[...todos].sort((a,b)=> a.done-b.done || b.carry-a.carry);
  const done=todos.filter(t=>t.done).length;
  document.getElementById('todoCount').textContent=`${done}/${todos.length}`;
  document.getElementById('rightTodoList').innerHTML = sorted.map(t=>`
    <div class="todo-row ${t.done?'done':''}" data-id="${t.id}">
      <span class="cbox">${t.done?'<i class="fa-solid fa-check"></i>':''}</span>
      <span class="tx">${t.text}</span>
      ${carryBadge(t)}
      <span class="todo-del" data-del="${t.id}"><i class="fa-solid fa-xmark"></i></span>
    </div>`).join('');
  bindTodoEvents(document.getElementById('rightTodoList'));
  if(typeof persist==='function') persist();
}
function bindTodoEvents(scope){
  scope.querySelectorAll('[data-id]').forEach(el=>{
    el.onclick=(e)=>{
      if(e.target.closest('[data-del]')) return;
      const t=todos.find(x=>x.id==el.dataset.id); if(t){t.done=!t.done; renderTodos();}
    };
  });
  scope.querySelectorAll('[data-del]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    todos=todos.filter(x=>x.id!=b.dataset.del); renderTodos();
  });
}

/* ============ 일정 추가 모달 ============ */
const LEAD_OPTIONS=[{v:0,label:'정각'},{v:1,label:'1분 전'},{v:5,label:'5분 전'},{v:15,label:'15분 전'},{v:30,label:'30분 전'},{v:60,label:'1시간 전'}];
let modalTypeId=null, modalAlarmOn=false, modalLead=0, modalDeadline=false, modalEditId=null;
function openModal(dateKey, editEvent){
  document.getElementById('modalBg').classList.add('show');
  const d=new Date(dateKey);
  document.getElementById('modalDate').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  document.getElementById('modalDateInput').value=dateKey;
  document.getElementById('modalBg').dataset.date=dateKey;
  if(editEvent){
    // 수정 모드
    modalEditId=editEvent.id;
    modalTypeId=editEvent.typeId; modalAlarmOn=!!editEvent.alarm; modalLead=editEvent.lead||0; modalDeadline=!!editEvent.isDeadline;
    document.getElementById('modalTitle').value=editEvent.title||'';
    document.getElementById('modalTime').value=editEvent.time||'';
    document.querySelector('#modalBg h3').childNodes[0].nodeValue='일정 수정 ';
    document.getElementById('modalSubmit').textContent='저장하기';
  }else{
    // 추가 모드
    modalEditId=null;
    modalTypeId=types[0].id; modalAlarmOn=false; modalLead=0; modalDeadline=false;
    document.getElementById('modalTitle').value='';
    document.getElementById('modalTime').value='';
    document.querySelector('#modalBg h3').childNodes[0].nodeValue='일정 추가 ';
    document.getElementById('modalSubmit').textContent='추가하기';
  }
  renderModalTypes(); renderModalLead(); updateModalAlarm(); updateModalDeadline();
  setTimeout(()=>document.getElementById('modalTitle').focus(),50);
}
function updateModalDeadline(){
  document.getElementById('modalDeadlineRow').classList.toggle('on',modalDeadline);
}
function renderModalTypes(){
  document.getElementById('modalTypes').innerHTML=types.map(t=>{
    const on=t.id===modalTypeId;
    return `<button class="m-type" data-id="${t.id}" style="${on?`border-color:${t.color};background:${t.color}22;color:${t.color}`:''}"><span class="d" style="background:${t.color}"></span>${t.name}</button>`;
  }).join('');
  document.querySelectorAll('#modalTypes .m-type').forEach(b=>b.onclick=()=>{modalTypeId=b.dataset.id;renderModalTypes();});
}
function renderModalLead(){
  document.getElementById('modalLeadOpts').innerHTML=LEAD_OPTIONS.map(o=>
    `<button class="m-lead-opt ${o.v===modalLead?'on':''}" data-lead="${o.v}">${o.label}</button>`).join('');
  document.querySelectorAll('#modalLeadOpts .m-lead-opt').forEach(b=>b.onclick=()=>{modalLead=+b.dataset.lead;renderModalLead();});
}
function updateModalAlarm(){
  const time=document.getElementById('modalTime').value;
  const btn=document.getElementById('modalAlarm');
  const note=document.getElementById('modalSoundNote');
  const lead=document.getElementById('modalLead');
  if(!time){btn.classList.add('disabled');btn.classList.remove('on');modalAlarmOn=false;
    btn.innerHTML='<i class="fa-solid fa-bell-slash"></i> 알림';note.style.display='none';lead.style.display='none';return;}
  btn.classList.remove('disabled');
  btn.classList.toggle('on',modalAlarmOn);
  btn.innerHTML=modalAlarmOn?'<i class="fa-solid fa-bell"></i> 알림 켜짐':'<i class="fa-solid fa-bell-slash"></i> 알림';
  if(modalAlarmOn){
    lead.style.display='block';
    note.style.display='flex';note.style.color=soundOn?'var(--accent)':'var(--ink-faint)';
    const leadLabel=LEAD_OPTIONS.find(o=>o.v===modalLead)?.label||'정각';
    note.innerHTML=`<i class="fa-solid fa-volume-high"></i> ${soundOn?(modalLead===0?'설정한 시각에 소리로 알려줘요':leadLabel+' 소리로 알려줘요'):'소리 꺼짐 (설정에서 켤 수 있어요)'}`;
  }else{note.style.display='none';lead.style.display='none';}
}
function submitModal(){
  const origKey=document.getElementById('modalBg').dataset.date;
  const newKey=document.getElementById('modalDateInput').value || origKey; // 바뀐 날짜(다른 달도 가능)
  const title=document.getElementById('modalTitle').value.trim();
  const time=document.getElementById('modalTime').value;
  if(!title){document.getElementById('modalTitle').focus();return;}
  const alarm=!!time&&modalAlarmOn;
  if(modalEditId){
    // 수정: 원래 날짜에서 꺼내서 갱신 후, (날짜가 바뀌었으면) 새 날짜에 넣기
    const list=events[origKey]||[];
    const idx=list.findIndex(e=>e.id===modalEditId);
    if(idx>=0){
      const ev=list[idx];
      ev.title=title; ev.time=time||null; ev.alarm=alarm; ev.lead=alarm?modalLead:0; ev.typeId=modalTypeId; ev.isDeadline=modalDeadline;
      if(newKey!==origKey){
        list.splice(idx,1);
        if(!list.length) delete events[origKey];
        if(!events[newKey]) events[newKey]=[];
        events[newKey].push(ev);
      }
    }
  }else{
    // 추가 (고른 날짜에)
    if(!events[newKey]) events[newKey]=[];
    events[newKey].push({id:++uid,title,time:time||null,alarm,lead:alarm?modalLead:0,typeId:modalTypeId,isDeadline:modalDeadline});
  }
  document.getElementById('modalBg').classList.remove('show');
  selectedDate=newKey;
  // 다른 달로 갔으면 그 달로 화면 이동
  const nd=new Date(newKey); viewY=nd.getFullYear(); viewM=nd.getMonth();
  renderAll();
}

  renderTypeFilters();
  if(calView==='month') renderMonth(); else renderWeek();
  renderSelectedDay(); renderDday(); renderTodos();
}

/* 알림음: 4종류, 각각 여러 번 반복해서 확실히 들리게 */
let soundType='bell';
const SOUNDS={
  bell:{name:'벨 (따르릉)',icon:'fa-bell'},
  chime:{name:'차임 (딩동)',icon:'fa-door-open'},
  alarm:{name:'알람 (삐빅)',icon:'fa-clock'},
  marimba:{name:'실로폰',icon:'fa-music'},
};
function tone(ctx,freq,start,dur,type,vol){
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=type; osc.frequency.value=freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const t=ctx.currentTime+start;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(vol,t+0.015);
  gain.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.start(t); osc.stop(t+dur);
}
function playSound(kind){
  kind=kind||soundType;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(kind==='bell'){
      // 따르릉따르릉 — 두 음 교대로 4번
      for(let i=0;i<4;i++){const b=i*0.28;
        tone(ctx,988,b,0.13,'square',0.16);
        tone(ctx,1319,b+0.13,0.13,'square',0.16);}
      setTimeout(()=>ctx.close(),1600);
    }else if(kind==='chime'){
      // 딩동 딩동 (2회)
      [[0,660],[0.18,880],[0.6,660],[0.78,880]].forEach(([d,f])=>tone(ctx,f,d,0.5,'sine',0.26));
      setTimeout(()=>ctx.close(),1600);
    }else if(kind==='alarm'){
      // 삐빅삐빅 — 날카롭게 6번
      for(let i=0;i<6;i++) tone(ctx,1568,i*0.16,0.09,'square',0.14);
      setTimeout(()=>ctx.close(),1300);
    }else if(kind==='marimba'){
      // 실로폰 상행 아르페지오 2회
      const notes=[523,659,784,1047];
      for(let r=0;r<2;r++) notes.forEach((f,i)=>tone(ctx,f,r*0.6+i*0.12,0.4,'triangle',0.3));
      setTimeout(()=>ctx.close(),1700);
    }
  }catch(e){}
}
function renderSoundPicker(){
  const box=document.getElementById('soundPicker');
  box.innerHTML=Object.entries(SOUNDS).map(([k,s])=>
    `<div class="sound-opt ${k===soundType?'on':''}" data-sound="${k}">
      <span class="so-ic"><i class="fa-solid ${s.icon}"></i></span>
      <span class="so-name">${s.name}</span>
      <span class="so-play"><i class="fa-solid fa-play"></i> 듣기</span>
    </div>`).join('');
  box.querySelectorAll('.sound-opt').forEach(el=>el.onclick=()=>{
    soundType=el.dataset.sound; renderSoundPicker(); playSound(soundType);
    if(typeof persist==='function') persist();
  });
}
renderSoundPicker();

const sw=document.getElementById('swatches'),root=document.documentElement;
let curPal=0,curMode='light';
function applyPalette(i){const p=palettes[i];curPal=i;
  root.style.setProperty('--accent',p.a);root.style.setProperty('--accent-2',p.a2);root.style.setProperty('--accent-3',p.a3);

    root.style.setProperty('--bg',d.bg);root.style.setProperty('--surface',d.surf);root.style.setProperty('--surface-2',d.s2);
    root.style.setProperty('--sidebar',d.side);root.style.setProperty('--line',d.line);root.style.setProperty('--line-2',d.line2);root.style.setProperty('--frame',d.frame);
  }else{const l=p.L;
    root.style.setProperty('--bg',l.bg);root.style.setProperty('--surface','#ffffff');root.style.setProperty('--surface-2',l.s2);
    root.style.setProperty('--sidebar',l.side);root.style.setProperty('--line',l.line);root.style.setProperty('--line-2',l.line2);root.style.setProperty('--frame',l.frame);
  }
  document.querySelectorAll('.sw').forEach((s,idx)=>s.classList.toggle('on',idx===i));}
palettes.forEach((p,i)=>{const s=document.createElement('div');s.className='sw'+(i===0?' on':'');
  s.style.background=`linear-gradient(135deg,${p.a},${p.a3})`;s.title=p.name;s.onclick=()=>{applyPalette(i);if(typeof persist==='function')persist();};sw.appendChild(s);});
const lightBtn=document.getElementById('lightBtn'),darkBtn=document.getElementById('darkBtn');
function setMode(m){curMode=m;root.setAttribute('data-theme',m);
  lightBtn.classList.toggle('on',m==='light');darkBtn.classList.toggle('on',m==='dark');applyPalette(curPal);}

// 검색: 엔터 시 일치하는 첫 일정의 날짜로 이동+선택
document.getElementById('searchInput').onkeydown=function(e){
  if(e.key!=='Enter') return;
  const q=this.value.trim(); if(!q) return;
  let hits=[];
  Object.entries(events).forEach(([key,list])=>{const d=new Date(key);
    list.forEach(ev=>{if(ev.title.includes(q))hits.push({key,d});});});
  if(!hits.length){this.style.outline='2px solid #ff5b6e';setTimeout(()=>this.style.outline='',600);return;}
  hits.sort((a,b)=>Math.abs(a.d-TODAY)-Math.abs(b.d-TODAY));
  const target=hits[0];
  goPage('calPage');
  viewY=target.d.getFullYear(); viewM=target.d.getMonth();
  selectedDate=target.key;
  switchView('month'); renderAll();
};

/* ============ 데이터 지속성 & 알림 (Electron 연동) ============ */
const isElectron = typeof window !== 'undefined' && window.moaAPI;

// 창 제어 버튼 (커스텀 타이틀바)
if(isElectron){
  document.body.classList.add('app-mode');
  document.getElementById('winMin').onclick=()=>window.moaAPI.minimizeWindow();
  document.getElementById('winClose').onclick=()=>window.moaAPI.closeWindow();
}

// 현재 상태를 하나의 객체로 모음
function collectState(){
  return { types, events, todos, memos, uid, soundOn, soundType, palIndex: curPal, mode: curMode };
}

// 저장된 상태를 전역 변수에 복원
function applyState(s){
  if(!s) return;
  if(Array.isArray(s.types)) types = s.types;
  if(s.events && typeof s.events==='object') events = s.events;
  if(Array.isArray(s.todos)) todos = s.todos;
  if(Array.isArray(s.memos)) memos = s.memos;
  if(typeof s.uid==='number') uid = s.uid;
  if(typeof s.soundOn==='boolean') soundOn = s.soundOn;
  if(typeof s.soundType==='string') soundType = s.soundType;
  if(typeof s.palIndex==='number') curPal = s.palIndex;
  if(typeof s.mode==='string') curMode = s.mode;
  // 예전 데이터 호환: isDeadline 없던 시절 '예약마감' 종류는 마감으로 간주
  Object.values(events).forEach(list=>list.forEach(e=>{
    if(e.isDeadline===undefined) e.isDeadline = (e.typeId==='deadline');
  }));
}

// 저장 + 알림 재예약 (디바운스로 잦은 쓰기 방지)
let _saveTimer=null;
function persist(){
  if(!isElectron) return; // 브라우저 미리보기에선 저장 안 함
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async ()=>{
    const state = collectState();
    await window.moaAPI.saveData(state);
    await window.moaAPI.rescheduleAlarms({ events, soundOn, soundType });
  }, 400);
}

// renderAll이 끝날 때마다 저장되도록 래핑
const _renderAllOrig = renderAll;
renderAll = function(){ _renderAllOrig(); persist(); };

// soundToggle, 소리 종류 변경, 테마 변경도 저장 대상 → persist 호출 보강
const _soundToggle = document.getElementById('soundToggle');
if(_soundToggle){ const orig=_soundToggle.onclick; _soundToggle.onclick=function(){ orig&&orig.call(this); persist(); }; }

/* ============ 초기화 ============ */
async function boot(){
  if(isElectron){
    const saved = await window.moaAPI.loadData();
    if(saved){
      // 저장된 데이터가 있으면 복원, 없으면(첫 실행) 빈 상태로 시작
      applyState(saved);
      selectedDate = TK;
      viewY = TODAY.getFullYear(); viewM = TODAY.getMonth();
    }else{
      // 첫 실행: 더미 데이터 대신 깨끗하게 시작
      events = {}; todos = []; memos = [];
    }
    // 메인 프로세스가 "알림 시각이야, 소리 재생해" 신호를 보내면 재생
    window.moaAPI.onPlayAlarmSound((kind)=>{ playSound(kind||soundType); });
  }

  applyPalette(typeof curPal==='number'?curPal:0);
  setMode(curMode||'light');
  renderSoundPicker();
  switchView('month');
  renderAll();

  // 시작 시 알림 예약 한 번
  if(isElectron){
    window.moaAPI.rescheduleAlarms({ events, soundOn, soundType });
  }
}
boot();
